# yaml-language-server: $schema=../../schemas/asset-pipeline.schema.json
#
# THE asset pipeline. This file is master.
#
# `documentation/SolarPunk Jam - Asset Pipeline.svg` is the Miro board this was
# derived from; it is now a historical snapshot. Edit this file, then run:
#
#     python .github/scripts/validate-pipeline-doc.py
#     python tools/pipeline/render_pipeline.py
#
# See documentation/pipeline/README.md.

schema_version: 1
title: SolarPunk Jam Asset Pipeline
description: >-
  How an asset gets from a request to a shipped level. Five phases, all of them
  loops. The static 3D pipeline is documented in full; the 2D and audio
  pipelines are stubs that record only what is already enforced in code.

source:
  diagram: documentation/SolarPunk Jam - Asset Pipeline.svg
  exported_from: miro
  status: superseded
  note: >-
    The board drew the five phases as a left-to-right sequence with a single
    "Repeat" arrow. That was the reason for writing this file: in practice every
    phase is re-entered, and assets flow backwards constantly. The `edges` list
    below records the rework and repeat paths the board omitted.

roles:
  - id: artist
    title: Artist
    description: Models and textures the asset in Blender and Substance Painter.
  - id: integrator
    title: Integrator
    description: >-
      Owns the Godot-side files that wrap an incoming model. Works in files the
      artists never touch, so re-exports can never clobber integration work.
  - id: programmer
    title: Programmer
    description: Adds logic and components to a model, producing a drop-in prefab.
  - id: level_designer
    title: Level Designer
    description: Assembles prefabs into playable levels.

tools:
  - id: blender
    name: Blender
    url: https://www.blender.org/
    notes: Modelling and glTF export.
  - id: substance_painter
    name: Adobe Substance 3D Painter
    url: https://www.adobe.com/products/substance3d/apps/painter.html
    notes: Texturing and PBR map export.
  - id: godot
    name: Godot Engine
    url: https://godotengine.org/
    notes: Version is pinned by the GODOT_VERSION repo variable; see .github/workflows/README.md.
  - id: github_desktop
    name: GitHub Desktop
    url: https://desktop.github.com/
    notes: The commit path assumed by this pipeline. Any git client works.
  - id: os_explorer
    name: Operating system file explorer
    notes: Used to confirm sidecar files that Godot's own FileSystem dock hides.
  - id: blender_vehicle_kit
    name: Procedural vehicle toolkit
    notes: >-
      tools/blender-vehicle/ - builds a vehicle in Blender from a Python
      description: geometry, UVs, a baked 2048 atlas, collision proxies and a
      validated glTF, in two calls. Only models/<name>.py is bespoke. Its README
      is the retrospective from assets/art/3d/vehicles/jeep_turret, including the
      traps that cost a rebuild to find. Run build.blockout() and get the
      silhouette approved before build.produce(), which spends ~90 seconds baking.

