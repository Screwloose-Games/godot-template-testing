# Values this document asserts that are also hardcoded in scripts. The validator
# imports each symbol and fails if they diverge, so a convention cannot be
# changed in only one place.
code_mirrors:
  - id: audio_filename_pattern
    path: .github/scripts/validate-audio-files.py
    symbol: FILENAME_PATTERN
    value: "^[a-z0-9]+(_[a-z0-9]+)*\\.[a-z0-9]+$"
  - id: aseprite_filename_pattern
    path: .github/scripts/validate-aseprite-files.py
    symbol: FILENAME_PATTERN
    value: "^[a-z0-9]+(_[a-z0-9]+)*\\.[a-z0-9]+$"
  - id: aseprite_tag_name_pattern
    path: .github/scripts/validate-aseprite-files.py
    symbol: TAG_NAME_PATTERN
    value: "^[a-z0-9]+(_[a-z0-9]+)*$"
  - id: max_texture_dimension
    path: .github/scripts/validate-aseprite-files.py
    symbol: MAX_TEXTURE_DIMENSION
    value: 1024
  - id: aseprite_path_root
    path: .github/scripts/validate-aseprite-files.py
    symbol: PATH_CONVENTION_ROOT
    value: assets/art/2d
    note: >-
      2D art lives under assets/art/2d/, 3D under assets/art/3d/, alongside
      assets/music/ and assets/sfx/. Aseprite filenames are only enforced under
      this root, so fixtures and tooling samples elsewhere are exempt.
  - id: aseprite_tags_required
    path: .github/scripts/validate-aseprite-files.py
    symbol: ENFORCE_TAGS_REQUIRED
    value: false
    note: Deliberately off. See the sprite_2d pipeline's open questions.
  - id: aseprite_one_shot_repeat
    path: .github/scripts/validate-aseprite-files.py
    symbol: ENFORCE_ONE_SHOT_REPEAT
    value: false
    note: Deliberately off. See the sprite_2d pipeline's open questions.
  - id: model_filename_pattern
    path: .github/scripts/validate-model-files.py
    symbol: MODEL_FILENAME_PATTERN
    value: "^sm_[a-z0-9]+(_[a-z0-9]+)*\\.gltf$"
  - id: skeletal_model_filename_pattern
    path: .github/scripts/validate-model-files.py
    symbol: SKELETAL_FILENAME_PATTERN
    value: "^sk_[a-z0-9]+(_[a-z0-9]+)*\\.gltf$"
  - id: model_path_root
    path: .github/scripts/validate-model-files.py
    symbol: MODEL_ROOT
    value: assets/art/3d
    note: >-
      3D assets live under assets/art/3d/, 2D art under assets/art/2d/ - siblings
      under one assets/art/ root, alongside assets/music/ and assets/sfx/. Model
      filenames are only enforced under this root, so examples/ can hold
      prototypes and third-party art that ignore the convention on purpose.
  - id: model_spec_schema_enforced
    path: .github/scripts/validate-model-files.py
    symbol: ENFORCE_SPEC_SCHEMA
    value: true
    note: >-
      Checks each spec against schemas/model-spec.schema.json, whose
      additionalProperties: false turns a misspelled key into an error. Before
      this, such a key was ignored and the check it enabled silently never ran.
  - id: model_godot_import_enforced
    path: .github/scripts/validate-model-files.py
    symbol: ENFORCE_GODOT_IMPORT
    value: true
    note: >-
      Checks that a model is still correct after Godot has imported it: node names
      the importer silently reinterprets as node types, and collision proxies
      larger than the art they stand in for. Both describe files that are valid
      glTF and wrong in the engine, so no other check here can see them. Each cost
      a round trip through the Godot editor to find by hand before this existed.
  - id: model_spec_required
    path: .github/scripts/validate-model-files.py
    symbol: ENFORCE_SPEC_REQUIRED
    value: false
    note: >-
      Deliberately off - a model with no spec passes, as spec_file.required says.
      Turn it on once specs are the norm.
  - id: wav_specifications
    path: .github/scripts/validate-audio-files.py
    symbol: WAV_FILE_SPECIFICATIONS
    value:
      sample_rate: 44100
      bit_depth: 16
      channels: 1
      target_lufs: -16
      peak_volume: -1.0
      looping: false
      filename_convention:
        casing: lowercase
        separator: underscore
        extension: .wav
      max_length: 10
      max_file_size: 51380224

pipelines:
  # ---------------------------------------------------------------------------
  - id: static_3d
    title: Static 3D Asset Pipeline
    status: authoritative
    entry_step: art.claim_asset
    summary: >-
      A static prop or building, from a placeholder cube to a prefab placed in a
      level. Named "static" because these assets carry no skeletal animation;
      skeletal meshes follow the same route with an sk_ prefix.

    conventions:
      rules:
        - id: asset_type_prefixes
          statement: >-
            Name every asset [prefix]_[asset_name]_[descriptor]_[variant], where
            the prefix says what kind of thing the file is. Descriptor and variant
            are only used where they mean something.
          why: >-
            Unreal's convention, in lowercase. The prefix sorts related files
            together and tells you what a file is before you open it, which
            matters most in a flat FileSystem dock.
          severity: blocking
          checklist: Filenames follow [prefix]_[asset_name]_[descriptor]_[variant].
          enforced_by:
            - kind: review
          # Prefixes in use:
          #   sm_      static mesh          sm_rain_barrel.gltf
          #   sk_      skeletal mesh        sk_wolf.gltf
          #   t_       texture              t_rain_barrel_basecolor.png
          #   prefab_  prefab scene         prefab_rain_barrel.tscn
          #   level_   level scene          level_main.tscn
          # The model container scene deliberately has no prefix of its own: it
          # reuses its mesh's full stem so the pair reads as one unit.
        - id: lowercase_filenames
          statement: Name every file you author in lowercase, with underscores between words.
          why: >-
            Godot generates lowercase names for everything it creates. Going with
            it is cheaper than having every contributor change their editor
            settings, or re-editing what Godot generates each time.
          severity: blocking
          checklist: All authored filenames are lowercase with underscore separators.
          enforced_by:
            - kind: script
              path: .github/scripts/validate-audio-files.py
              symbol: FILENAME_PATTERN
              note: Enforced for audio and 2D art. Not yet enforced for 3D filenames.
            - kind: review
              note: 3D filenames are checked by hand at review time.
        - id: no_fbx
          statement: Deliver models as glTF. Never commit .fbx.
          why: FBX is a proprietary format with inconsistent importer behaviour across DCCs.
          severity: blocking
          checklist: No .fbx files are included.
          enforced_by:
            - kind: workflow
              path: .github/workflows/flag-fbx-files.yml
              blocking: true
        - id: commit_import_sidecars
          statement: Commit the .import sidecar Godot generates for every asset file.
          why: >-
            Without the sidecar, the asset's resource UID differs on every
            machine, so scene references break for everyone but you.
          severity: blocking
          checklist: The .import sidecar for every added asset is committed.
          enforced_by:
            - kind: workflow
              path: .github/workflows/check-import-files.yml
              blocking: true
              note: >-
                On same-repo PRs this workflow generates and pushes missing
                sidecars for you. On fork PRs it fails and uploads them as an
                artifact instead.

      naming_patterns:
        - id: static_mesh_gltf
          pattern: sm_{object}.gltf  or  sm_{object}_{variation}.gltf
          regex: "^sm_[a-z0-9]+(_[a-z0-9]+)*\\.gltf$"
          description: >-
            Static mesh. The variation suffix is optional - an object with only
            one form does not need one.
          examples:
            valid:
              - sm_rain_barrel.gltf
              - sm_raised_bed.gltf
              - sm_office_building_small.gltf
            invalid:
              - sm_RainBarrel.gltf
              - rain_barrel.gltf
              - sm_rain-barrel.gltf
              - sm_rain_barrel.glb
          enforced_by:
            - kind: script
              path: .github/scripts/validate-model-files.py
              note: >-
                Enforced under assets/art/3d/ only. examples/ holds self-contained
                prototypes and third-party art that deliberately do not follow
                the shared conventions.
          deprecated_aliases:
            - pattern: "{object}.gltf"
              note: Unprefixed names predate the sm_/sk_ split. Rename on next touch.
            - pattern: game/{game_object_directory}/{object_name}.gltf
              note: >-
                The game/ root was asked for by older issue templates and no
                longer exists. 3D assets live under assets/art/3d/ and 2D art
                under assets/art/2d/. Kept so the old form is still recognised
                and reported rather than passing unnoticed.
        - id: skeletal_mesh_gltf
          pattern: sk_{object}.gltf
          regex: "^sk_[a-z0-9]+(_[a-z0-9]+)*\\.gltf$"
          description: Skeletal mesh - a model with an armature.
          examples:
            valid:
              - sk_wolf.gltf
              - sk_hamster.gltf
            invalid:
              - sm_wolf.gltf
              - sk_Wolf.gltf
              - wolf_sk.gltf
          enforced_by:
            - kind: script
              path: .github/scripts/validate-model-files.py
              note: Enforced under assets/art/3d/ only, as for static meshes.
        - id: gltf_binary_buffer
          pattern: "{mesh_stem}.bin"
          regex: "^s[mk]_[a-z0-9]+(_[a-z0-9]+)*\\.bin$"
          description: >-
            The buffer Blender writes beside a separate-format glTF. Its name is
            generated - never rename it, the .gltf references it by name.
          examples:
            valid:
              - sm_rain_barrel.bin
              - sk_wolf.bin
            invalid:
              - rain_barrel.bin
              - sm_rain_barrel.buffer
          enforced_by:
            - kind: workflow
              path: .github/workflows/validate-gltf-files.yml
              blocking: true
              note: A glTF whose buffer is missing or misnamed fails to parse.
        - id: texture_map
          pattern: t_{asset_name}_{descriptor}.png  or  t_{asset_name}_{descriptor}_{variant}.png
          regex: "^t_[a-z0-9]+(_[a-z0-9]+)*_(basecolor|diffuse|normal|orm|occlusionroughnessmetallic|roughness|metallic|ao|emissive|height|opacity)(_[a-z0-9]+)?\\.png$"
          description: >-
            Same [prefix]_[name]_[descriptor]_[variant] shape as the meshes, with
            the texture prefix t_. Set this as the filename pattern in the
            exporter rather than renaming files afterwards - see the
            never_hand_rename_textures rule.
          examples:
            valid:
              - t_rain_barrel_basecolor.png
              - t_rain_barrel_normal.png
              - t_office_building_small_orm.png
              - t_rain_barrel_basecolor_02.png
            invalid:
              - T_RainBarrel_BaseColor.png
              - rain_barrel_basecolor.png
              - t_rain_barrel.png
              - RainBarrel_Base_Color.png
          enforced_by:
            - kind: review
          deprecated_aliases:
            - pattern: "{WhateverTheExporterWrote}.png"
              note: >-
                Exporter-given mixed-case names such as RainBarrel_Base_Color.png.
                Committed assets still use these. Do not hand-rename them - fix
                the exporter's filename pattern and re-export, so the URIs inside
                the .gltf are rewritten at the same time.
            - pattern: "{mesh_stem}_{map}.png"
              note: >-
                sm_office_building_small_diffuse.png, from the original diagram's
                templated tree. Superseded by the t_ prefix.
            - pattern: tex_{asset_name}_{descriptor}.png
              note: >-
                Asked for by an older version of
                .github/ISSUE_TEMPLATE/create_texture_for_model.yaml. Never used
                by any committed asset. Superseded by t_.
        - id: model_container_scene
          pattern: "{mesh_stem}.tscn"
          regex: "^s[mk]_[a-z0-9]+(_[a-z0-9]+)*\\.tscn$"
          description: >-
            The inherited scene wrapping a model. Shares the mesh's stem and sits
            in the same directory, so the pair is obvious at a glance.
          examples:
            valid:
              - sm_rain_barrel.tscn
              - sk_wolf.tscn
            invalid:
              - rain_barrel.tscn
              - prefab_rain_barrel.tscn
              - sm_rain_barrel.scn
          enforced_by:
            - kind: review
        - id: prefab_scene
          pattern: prefab_{object}.tscn  or  prefab_{object}_{variation}.tscn
          regex: "^prefab_[a-z0-9]+(_[a-z0-9]+)*\\.tscn$"
          examples:
            valid:
              - prefab_rain_barrel.tscn
              - prefab_office_building_small.tscn
            invalid:
              - rain_barrel_prefab.tscn
              - prefab_RainBarrel.tscn
              - prefab_rain_barrel.scn
          enforced_by:
            - kind: review
        - id: level_scene
          pattern: level_{level}.tscn  or  level_{level}_{variation}_{version}.tscn
          regex: "^(test_)?level_[a-z0-9]+(_[a-z0-9]+)*\\.tscn$"
          description: Test levels take the same name with a test_ prefix.
          examples:
            valid:
              - level_main.tscn
              - level_market_night_v2.tscn
              - test_level_main.tscn
            invalid:
              - main_level.tscn
              - Level_Main.tscn
              - level_main.scn
          enforced_by:
            - kind: review
        - id: godot_import_sidecar
          pattern: "{full_filename}.import"
          regex: "^[a-zA-Z0-9_]+(\\.[a-z0-9]+)+\\.import$"
          description: >-
            Generated by Godot. Keeps the asset's full filename including its
            original extension - sm_rain_barrel.gltf.import, not
            sm_rain_barrel.import.
          examples:
            valid:
              - sm_rain_barrel.gltf.import
              - RaisedBed_Base_Color.png.import
            invalid:
              - sm_rain_barrel.import
              - sm_rain_barrel.gltf.IMPORT
          enforced_by:
            - kind: workflow
              path: .github/workflows/check-import-files.yml
              blocking: true
        - id: model_spec
          pattern: "{model_filename}.spec.yaml"
          regex: "^s[mk]_[a-z0-9]+(_[a-z0-9]+)*\\.gltf\\.spec\\.yaml$"
          description: >-
            Machine-checkable acceptance criteria for one model, read by the
            glTF validator. Sits beside the .gltf.
          examples:
            valid:
              - sm_rain_barrel.gltf.spec.yaml
              - sk_wolf.gltf.spec.yaml
            invalid:
              - sm_rain_barrel.spec.yaml
              - sm_rain_barrel.gltf.spec.yml
          enforced_by:
            - kind: workflow
              path: .github/workflows/validate-gltf-files.yml
              blocking: true
              note: >-
                A model with no spec file passes silently, so the spec is how a
                model gains acceptance criteria at all.

      directory_layout:
        - path: assets/art/3d/{category}/{object}/
          description: >-
            Everything belonging to one 3D object: the mesh, its buffer, its
            textures, every .import sidecar, and the model container scene.
            One directory per object, so a re-export touches nothing else.
          example: assets/art/3d/structures/raised_bed/
          contains:
            - static_mesh_gltf
            - gltf_binary_buffer
            - texture_map
            - godot_import_sidecar
            - model_container_scene
            - model_spec
        - path: prefabs/{category}/
          description: Prefab scenes, grouped by the same category names used under assets/art/3d/.
          example: prefabs/structures/
          contains:
            - prefab_scene
        - path: levels/
          description: Shipping level scenes.
          example: levels/level_main.tscn
          contains:
            - level_scene
        - path: test/levels/
          description: Scratch levels for trying assets out. Not shipped.
          example: test/levels/test_level_main.tscn
          contains:
            - level_scene

    artifact_kinds:
      - id: blend_source
        title: Blender source file
        description: The editable model. Not consumed by Godot.
        extensions: [.blend]
        generated: false
      - id: static_mesh_gltf
        title: Static mesh (glTF)
        extensions: [.gltf]
        naming: static_mesh_gltf
        location: assets/art/3d/{category}/{object}/
        generated: true
        required_siblings: [gltf_binary_buffer, godot_import_sidecar]
        optional_siblings: [texture_map, model_spec]
        spec_file:
          pattern: "{artifact}.spec.yaml"
          schema: schemas/model-spec.schema.json
          required: false
          note: >-
            Strongly recommended. Without it the glTF validator reports geometry
            facts but cannot pass or fail anything.
        validated_by:
          - kind: workflow
            path: .github/workflows/validate-gltf-files.yml
            blocking: true
          - kind: script
            path: .github/scripts/validate-model-files.py
            blocking: true
            note: >-
              Decides pass or fail. Runs identically from a git pre-commit hook,
              a Claude Code hook, and the CI gate, so a model can be checked
              before it is ever committed. Needs no Docker.
          - kind: script
            path: tools/gltf-validator/validate_gltf.py
            note: >-
              Renders front/top/right ortho previews into the PR comment.
              Presentation only - it no longer decides anything.
      - id: gltf_binary_buffer
        title: glTF binary buffer
        extensions: [.bin]
        naming: gltf_binary_buffer
        generated: true
        location: Beside its .gltf.
      - id: texture_map
        title: Texture map
        description: >-
          Written by the exporter, but under a filename pattern you configure.
          Generated in the sense that you must not edit or rename it by hand.
        extensions: [.png, .jpg, .jpeg]
        naming: texture_map
        generated: true
        location: Beside the .gltf that references it.
        required_siblings: [godot_import_sidecar]
      - id: godot_import_sidecar
        title: Godot import sidecar
        description: >-
          Holds the resource UID and import settings. Godot writes it on first
          import; it must be committed.
        extensions: [.import]
        naming: godot_import_sidecar
        generated: true
        validated_by:
          - kind: workflow
            path: .github/workflows/check-import-files.yml
            blocking: true
      - id: model_spec
        title: Model spec
        description: Acceptance criteria for one model.
        extensions: [.yaml]
        naming: model_spec
        generated: false
        validated_by:
          - kind: workflow
            path: .github/workflows/validate-gltf-files.yml
            blocking: true
          - kind: script
            path: .github/scripts/validate-model-files.py
            blocking: true
            note: >-
              Checks the spec against schemas/model-spec.schema.json. The schema
              sets additionalProperties: false, so a misspelled key is now an
              error rather than being ignored in silence while the check it was
              meant to enable never runs. Also fails a spec with no model beside
              it, which catches the sm_rain_barrel.spec.yaml near-miss below.
      - id: model_container_scene
        title: Model container scene
        description: >-
          A scene inherited from the glTF. Owned by integration, never touched by
          the artists, so a re-export cannot clobber material overrides.
        extensions: [.tscn]
        naming: model_container_scene
        generated: false
        location: Beside the .gltf it inherits from.
      - id: override_material
        title: Override material
        extensions: [.tres]
        generated: false
      - id: spatial_shader
        title: Spatial shader
        extensions: [.gdshader]
        generated: false
      - id: prefab_scene
        title: Prefab scene
        description: A model container plus the logic that makes it a working game object.
        extensions: [.tscn]
        naming: prefab_scene
        generated: false
        location: prefabs/{category}/
      - id: level_scene
        title: Level scene
        extensions: [.tscn]
        naming: level_scene
        generated: false
        location: levels/ or test/levels/

    phases:
      # -----------------------------------------------------------------------
      - id: art
        title: Art
        lane: 1
        roles: [artist]
        summary: Model and texture the asset, then export it as glTF.
        loop:
          is_iterative: true
          iterates_on: One asset from the asset list.
          repeat_trigger: >-
            Art-direction feedback, a failed spec check from the glTF validator,
            or an integrator finding the model unusable.
          exit_criteria:
            - The exported .gltf opens in Godot without import errors.
            - Dimensions, pivot and poly count match the asset's spec.
        steps:
          - id: art.claim_asset
            title: Claim an asset
            role: artist
            summary: Pick an unclaimed asset from the asset list and open or assign its issue.
            instructions:
              - Find the asset on the asset list.
              - Assign yourself its "Create 3D model" issue, or open one if none exists.
              - Note the required dimensions in metres and the destination directory.
            opened_by_issue_template: .github/ISSUE_TEMPLATE/create_model.yaml
            outputs:
              - artifact_kind: model_spec
                optional: true
                note: The dimensions on the issue are what the spec file should encode.
            agent:
              automatable: partial
              preconditions:
                - The asset list and the issue tracker are reachable.
              verification:
                - The issue is assigned and names a destination directory.

          - id: art.create_placeholder
            title: Save a placeholder
            role: artist
            tool: blender
            summary: >-
              Put a stand-in glTF in the final destination directory before doing
              any real work, so integration and level design can start immediately.
            instructions:
              - Make a geometric shape at the asset's real dimensions. A box is fine.
              - Export it to the destination directory under the final filename.
              - Put a placeholder in every destination directory the asset needs.
            rules:
              - id: placeholder_real_dimensions
                statement: Build the placeholder at the asset's real dimensions.
                why: >-
                  Level designers block out space against it. A wrongly sized
                  placeholder means the level gets rebuilt when the real asset lands.
                severity: warning
                checklist: The placeholder matches the dimensions on the issue.
              - id: placeholder_final_name
                statement: Give the placeholder its final filename, not a temporary one.
                why: >-
                  Every later step replaces files by name. A placeholder named
                  something else has to be deleted by hand, and every reference
                  to it rebound.
                severity: blocking
                checklist: The placeholder uses the asset's final filename.
            opened_by_issue_template: .github/ISSUE_TEMPLATE/create_model.yaml
            outputs:
              - artifact_kind: static_mesh_gltf
            agent:
              automatable: none
              note: Needs Blender.

          - id: art.model
            title: Model the asset
            role: artist
            tool: blender
            summary: Build the real geometry.
            instructions:
              - >-
                If the asset is a vehicle, build it with tools/blender-vehicle/
                rather than by hand - it produces the geometry, UVs, a baked
                atlas, collision proxies and a validated glTF from one Python
                file, and its README records the traps that cost a rebuild to
                find. Get the blockout approved before the bake.
              - Model to the dimensions on the issue, in metres.
              - Set the pivot to the right place - usually bottom centre - and align it to the world origin.
              - UV unwrap, creating islands as needed.
              - Check the normals.
              - Keep the poly count inside the asset's budget.
            rules:
              - id: no_child_meshes
                statement: No mesh may have another mesh as a child.
                why: It breaks Godot's collision shape generation.
                severity: blocking
                checklist: No mesh has a child mesh.
              - id: godot_node_type_suffixes
                statement: >-
                  Do not end an object name in a word Godot's importer reads as a
                  node type - wheel, vehicle, rigid, occ, noimp, cycle or loop -
                  unless that node type is what you want.
                why: >-
                  Godot's scene importer reinterprets node names, and it matches
                  "_wheel" and "$wheel" as well as "-wheel". That is the same
                  mechanism that makes -convcolonly work, so it cannot be switched
                  off, and it means an ordinary descriptive name can silently
                  change a node's class: a mesh named steering_wheel arrives as a
                  VehicleWheel3D, a physics node that only functions parented to a
                  VehicleBody3D. The file is valid glTF throughout, so nothing but
                  this check can see it. Rename the object - steering_wheel_rim -
                  or, if the Godot node type really is the intent, list the suffix
                  in the spec's godot_node_suffixes_allowed.
                severity: blocking
                checklist: No object name ends in a Godot node-type suffix by accident.
                enforced_by:
                  - kind: workflow
                    path: .github/workflows/validate-gltf-files.yml
                    blocking: true
                    note: godot_node_suffixes, from tools/gltf-validator/gltf_godot_import.py.
              - id: collision_inside_visual
                statement: >-
                  Keep collision proxies inside the visual mesh they stand in for.
                why: >-
                  The size checks measure the whole file, so a proxy sticking out
                  past the art becomes the model's declared width, height or
                  depth - and the resulting failure points at a number that is
                  invisible in every render. A centimetre of slack is allowed,
                  because a proxy hugging a curved surface routinely pokes a few
                  millimetres past the faceted mesh approximating it.
                severity: blocking
                checklist: Collision proxies do not stick out past the visual mesh.
                enforced_by:
                  - kind: workflow
                    path: .github/workflows/validate-gltf-files.yml
                    blocking: true
                    note: collision_within_visual, from tools/gltf-validator/gltf_godot_import.py.
              - id: pivot_at_origin
                statement: Align the pivot point to the world origin.
                why: >-
                  Otherwise every placement in every level carries a compensating
                  offset that nobody remembers to apply.
                severity: blocking
                checklist: The pivot is at the world origin and in the correct spot on the model.
              - id: facing_direction_blender
                statement: Point the model's front down +Y in Blender.
                why: >-
                  +Y is the axis you can see yourself working against in Blender,
                  and it is the one that lands where the engine wants it. The
                  export converts Blender +Y to -Z in the glTF, and -Z is
                  Godot's forward - Vector3.FORWARD is (0, 0, -1). So a model
                  built to +Y in Blender is a model whose front points where
                  look_at() and -basis.z already point, with no compensating
                  rotation anywhere.
                severity: blocking
                checklist: The model faces +Y in Blender.
              - id: poly_budget
                statement: Stay within the poly count budget in the model's spec file.
                why: This is a web-first jam build; the frame budget is small.
                severity: blocking
                checklist: Poly count is within budget.
                enforced_by:
                  - kind: workflow
                    path: .github/workflows/validate-gltf-files.yml
                    blocking: true
                    note: Checked against poly_count_budget in the .spec.yaml.
            opened_by_issue_template: .github/ISSUE_TEMPLATE/create_model.yaml
            inputs:
              - artifact_kind: blend_source
                optional: true
            outputs:
              - artifact_kind: blend_source
            agent:
              automatable: partial
              note: >-
                Needs Blender, but not necessarily a human driving it. A vehicle
                can be built end to end by tools/blender-vehicle/ through the
                Blender MCP add-on - geometry, UVs, atlas, collision and a
                validated glTF - with only models/<name>.py written by hand. See
                that directory's README. Proportions and part layout are still
                judgement, which is what the blockout checkpoint is for.

          - id: art.texture
            title: Texture the asset
            role: artist
            tool: substance_painter
            summary: Paint the model and export PBR maps that Godot can read directly.
            instructions:
              - Texture the model in Substance Painter.
              - Open File > Export Textures.
              - Set Output template to "glTF PBR Metal Roughness".
              - Set the output directory to the asset's directory under assets/art/3d/{category}/{object}/.
              - Set the export filename pattern so the files land as t_{asset_name}_{descriptor}, lowercase.
            rules:
              - id: texture_naming_at_export
                statement: >-
                  Configure the exporter's filename pattern to emit
                  t_{asset_name}_{descriptor}.png, rather than renaming files
                  after the fact.
                why: >-
                  The .gltf references each image by URI. Renaming afterwards
                  breaks that reference, and the next export puts the old name
                  back. Setting the pattern once makes every future export
                  correct for free.
                severity: blocking
                checklist: Textures export as t_{asset_name}_{descriptor}.png, lowercase.
              - id: substance_output_template
                statement: Set the Substance Painter output template to "glTF PBR Metal Roughness".
                why: >-
                  It writes exactly the maps the glTF metallic-roughness model
                  expects, with the channel packing Godot assumes. Any other
                  template needs the maps rewired by hand on import.
                severity: blocking
                checklist: Textures were exported with the glTF PBR Metal Roughness template.
            screenshots:
              - image_id: art_substance_painter_output_template
                caption: >-
                  Pick "glTF PBR Metal Roughness" - not the Displacement variant,
                  and not USDz or Lumberyard.
            opened_by_issue_template: .github/ISSUE_TEMPLATE/create_texture_for_model.yaml
            outputs:
              - artifact_kind: texture_map
            agent:
              automatable: none
              note: Needs Substance Painter.

          - id: art.export_gltf
            title: Export glTF from Blender
            role: artist
            tool: blender
            summary: Export as separate glTF - not GLB - into the asset's directory.
            instructions:
              - File > Export > glTF 2.0.
              - In the Format dropdown choose "glTF Separate (.gltf + .bin + textures)".
              - Export into assets/art/3d/{category}/{object}/ using the sm_ or sk_ prefixed name.
            rules:
              - id: gltf_not_glb
                statement: Export "glTF Separate", never "glTF Binary (.glb)".
                why: >-
                  Separate keeps geometry, buffer and textures as distinct files,
                  so a texture can be re-exported without touching the mesh and a
                  diff shows what actually changed. GLB is one opaque blob.
                severity: blocking
                checklist: The model is exported as .gltf (separate), not .glb.
              - id: gltf_prefix
                statement: Prefix the filename sm_ for a static mesh, sk_ for a skeletal mesh.
                why: The prefix tells an integrator whether to expect an armature before opening the file.
                severity: blocking
                checklist: The filename is prefixed sm_ or sk_.
              - id: facing_direction_gltf
                statement: >-
                  Check that the exported .gltf faces -Z. A model facing +Y in
                  Blender becomes -Z in the glTF when the export is correct.
                why: >-
                  The .gltf is the file that gets validated and the file the game
                  loads; the .blend is only what the artist looks at. -Z is
                  Godot's forward, so this is the axis that makes the model face
                  the way the engine thinks it does. Note this is deliberately
                  not the glTF spec's own +Z-front convention: the spec is
                  written for viewers, and matching Godot matters more here than
                  matching Sketchfab. Do not "fix" it back to +Z.

                  Measured against a real export rather than assumed - see the
                  reference asset in assets/art/3d/example_cubes_facing, whose nub
                  sits on Blender +Y and lands on glTF -Z.
                severity: blocking
                checklist: The exported .gltf faces -Z (from +Y in Blender).
              - id: up_direction_gltf
                statement: The exported .gltf must be +Y up.
                why: >-
                  +Y up is the glTF convention and what Godot expects. Blender's
                  +Z up becomes +Y up through the same export conversion.
                severity: blocking
                checklist: The exported .gltf is +Y up.
                enforced_by:
                  - kind: workflow
                    path: .github/workflows/validate-gltf-files.yml
                    blocking: true
                    note: Checked against up_direction in the .spec.yaml.
            screenshots:
              - image_id: art_blender_gltf_export
                caption: >-
                  The Format dropdown, with "glTF Separate (.gltf + .bin +
                  textures)" selected.
            opened_by_issue_template: .github/ISSUE_TEMPLATE/create_model.yaml
            inputs:
              - artifact_kind: blend_source
            outputs:
              - artifact_kind: static_mesh_gltf
              - artifact_kind: gltf_binary_buffer
              - artifact_kind: texture_map
            agent:
              automatable: none
              note: Needs Blender.

      # -----------------------------------------------------------------------
      - id: update_in_place
        title: Update in place
        lane: 2
        roles: [artist]
        summary: >-
          Drop the exported files over the existing ones, let Godot import them,
          and commit. This is the loop an asset spends most of its life in.
        loop:
          is_iterative: true
          iterates_on: One revision of one asset.
          repeat_trigger: Any further change to the asset - more detail, better UVs, new textures.
          exit_criteria:
            - The asset renders correctly in Godot.
            - Every file and its .import sidecar are committed.
        steps:
          - id: update_in_place.update_asset
            title: Update the asset
            role: artist
            tool: blender
            summary: Make the next revision and re-export over the same filenames.
            instructions:
              - Add mesh detail.
              - UV unwrap.
              - Add or update textures.
              - Re-export, replacing the existing files.
            rules:
              - id: always_replace_same_name
                statement: Always replace the existing file with a file of the same name.
                why: >-
                  Every scene, prefab and level that references this asset does so
                  by path. A new filename orphans all of them, and the model
                  container scene an integrator built has to be rebuilt.
                severity: blocking
                checklist: The updated asset replaced the previous file under the same name.
            outputs:
              - artifact_kind: static_mesh_gltf
              - artifact_kind: texture_map
            agent:
              automatable: none

          - id: update_in_place.place_files
            title: Place the files in the asset directory
            role: artist
            summary: >-
              Copy the exported .gltf, .bin and textures into
              assets/art/3d/{category}/{object}/, overwriting what is there.
            instructions:
              - Copy the exported files into the asset's directory.
              - Overwrite the existing files; do not rename anything.
            rules:
              - id: never_hand_rename_textures
                statement: >-
                  Never rename a texture by hand. If a filename is wrong, fix the
                  exporter's filename pattern and re-export.
                why: >-
                  The .gltf references each image by URI, so a hand-rename breaks
                  the model until someone edits the .gltf too - and the next export
                  puts the old name back. Re-exporting rewrites both at once.
                severity: blocking
                checklist: No texture was renamed by hand; wrong names were fixed at the exporter.
              - id: one_directory_per_object
                statement: Keep every file for an object inside that object's own directory.
                why: >-
                  A re-export then touches exactly one directory, and a reviewer
                  can see the whole asset in one place.
                severity: warning
                checklist: All files for the object are in assets/art/3d/{category}/{object}/.
            screenshots:
              - image_id: update_autogenerated_texture_name
                caption: >-
                  The older exporter-given form, still present in committed
                  assets. RainBarrel_Base_Color.png would now export as
                  t_rain_barrel_basecolor.png - but change it at the exporter and
                  re-export, never by renaming the file here.
            opened_by_issue_template: .github/ISSUE_TEMPLATE/create_model.yaml
            inputs:
              - artifact_kind: static_mesh_gltf
              - artifact_kind: gltf_binary_buffer
              - artifact_kind: texture_map
            agent:
              automatable: full
              preconditions:
                - The exported files exist outside the repo.
                - The destination directory already exists.
              verification:
                - The destination directory contains the .gltf, .bin and every texture the .gltf references.

          - id: update_in_place.import_into_godot
            title: Import into Godot
            role: artist
            tool: godot
            summary: Drag the files into Godot's FileSystem dock so it generates the .import sidecars.
            instructions:
              - Open the project in Godot.
              - Drag and drop the files into the FileSystem window.
              - Wait for the import to finish.
            rules:
              - id: import_through_godot
                statement: Let Godot import the files rather than only copying them in the OS.
                why: >-
                  The import is what generates the .import sidecar, and the sidecar
                  is what fixes the resource UID across machines.
                severity: blocking
                checklist: The files were imported through the Godot editor.
            screenshots:
              - image_id: update_drag_into_godot_filesystem
                caption: The imported sm_rain_barrel.gltf in Godot's FileSystem dock.
            opened_by_issue_template: .github/ISSUE_TEMPLATE/create_model.yaml
            outputs:
              - artifact_kind: godot_import_sidecar
            agent:
              automatable: partial
              mcp_tools:
                - mcp__godot-ai__filesystem_manage
                - mcp__godot-ai__editor_state
              verification:
                - An .import file exists for every added asset file.

          - id: update_in_place.verify_import_sidecar
            title: Verify the .import sidecars exist
            role: artist
            tool: os_explorer
            summary: Confirm in the OS file explorer that each asset gained its .import file.
            instructions:
              - Open the asset's directory in your operating system's file explorer.
              - Confirm there is a .import file next to each asset file.
            rules:
              - id: check_outside_godot
                statement: Check in the OS explorer, not in Godot's FileSystem dock.
                why: Godot hides .import files from its own dock, so they look absent there.
                severity: advisory
                checklist: The .import sidecars were confirmed in the OS file explorer.
            screenshots:
              - image_id: update_import_sidecar_in_explorer
                caption: sm_rain_barrel.gltf.import, visible only outside the Godot editor.
            opened_by_issue_template: .github/ISSUE_TEMPLATE/create_model.yaml
            inputs:
              - artifact_kind: godot_import_sidecar
            agent:
              automatable: full
              verification:
                - Every asset file in the directory has a matching .import sibling.

          - id: update_in_place.commit
            title: Commit the files
            role: artist
            tool: github_desktop
            summary: Stage every changed file, including the sidecars, and commit.
            instructions:
              - Open GitHub Desktop on the repository.
              - Confirm the changed-files list includes the .gltf, the .bin, every texture, and every .import.
              - Write a message naming the asset, then commit and push.
              - Open a pull request.
            rules:
              - id: commit_all_siblings
                statement: Commit the asset, its buffer, its textures and all .import files together.
                why: >-
                  A partial commit leaves the branch in a state where the model
                  cannot be imported, which fails CI for whoever pushes next.
                severity: blocking
                checklist: The mesh, buffer, textures and every .import sidecar are in the same commit.
                enforced_by:
                  - kind: workflow
                    path: .github/workflows/check-import-files.yml
                    blocking: true
            screenshots:
              - image_id: update_commit_with_github_desktop
                caption: >-
                  Five files for one asset staged together - the texture, the
                  buffer, the mesh, and both .import sidecars.
            opened_by_issue_template: .github/ISSUE_TEMPLATE/create_model.yaml
            inputs:
              - artifact_kind: static_mesh_gltf
              - artifact_kind: gltf_binary_buffer
              - artifact_kind: texture_map
              - artifact_kind: godot_import_sidecar
            agent:
              automatable: partial
              preconditions:
                - The working tree contains only the intended asset changes.
              verification:
                - git status is clean after the commit.
                - The PR's glTF validation check passes.

      # -----------------------------------------------------------------------
      - id: integration
        title: Integration
        lane: 3
        roles: [integrator]
        summary: >-
          Wrap the incoming model in files the artists never touch, so material
          and shader work survives every re-export.
        loop:
          is_iterative: true
          iterates_on: One model.
          repeat_trigger: >-
            A re-export changes the model's material slots, or the look needs
            further work.
          exit_criteria:
            - A model container scene exists beside the model.
            - The model renders as intended in a test level.
        steps:
          - id: integration.create_container_scene
            title: Create the model container scene
            role: integrator
            tool: godot
            summary: >-
              Make an inherited scene from the glTF and save it beside the model.
            instructions:
              - Select the .gltf in Godot's FileSystem dock.
              - Right-click and choose "New Inherited Scene".
              - Save it in the same directory as the model, using the model's stem with a .tscn extension.
            rules:
              - id: container_scene_beside_model
                statement: Save the container scene in the same directory as the model.
                why: The pair stays obvious, and moving the object moves everything at once.
                severity: blocking
                checklist: The container scene sits beside its .gltf.
              - id: no_artist_edits_to_container
                statement: Only integration edits this file.
                why: >-
                  It is the whole point of the file. Artists overwrite the .gltf
                  freely; the container scene is where changes that must survive
                  that overwrite live.
                severity: blocking
                checklist: The container scene is not modified by an asset re-export.
            faq:
              - question: Why make this "model container scene"?
                answer: >-
                  So there is a file owned by the team integrating assets that
                  will not be touched by those uploading models and textures.
                  Modifications such as material settings go in this file, and a
                  re-export of the .gltf cannot destroy them.
            screenshots:
              - image_id: integration_new_inherited_scene
                caption: Right-click the .gltf and choose "New Inherited Scene".
            inputs:
              - artifact_kind: static_mesh_gltf
            outputs:
              - artifact_kind: model_container_scene
            agent:
              automatable: partial
              mcp_tools:
                - mcp__godot-ai__scene_manage
                - mcp__godot-ai__scene_save
                - mcp__godot-ai__scene_get_hierarchy
              verification:
                - The .tscn exists beside the .gltf and opens without errors.

          - id: integration.write_model_spec
            title: Write the model's spec file
            role: integrator
            summary: >-
              Record the model's acceptance criteria as {model}.gltf.spec.yaml so
              CI can check the next re-export against them instead of a human
              remembering.
            instructions:
              - Create {model_filename}.spec.yaml beside the .gltf.
              - Fill in width, height and depth in metres from the asset's issue.
              - Set poly_count_budget.
              - Set up_direction to "+Y" and facing_direction to "-Z" - these are glTF-space axes, not Blender's.
              - Declare collision_expected and navigation_expected.
              - List the textures the model must reference.
              - >-
                Check it before you commit: python .github/scripts/validate-model-files.py
                path/to/sm_thing.gltf. It prints the model's measured width, height,
                depth and triangle count, so you can read the real numbers off a
                model with no spec and write them down rather than guessing. It
                also rejects a misspelled key, which CI used to ignore in silence.
            rules:
              - id: spec_beside_model
                statement: Name the spec after the model's full filename, including .gltf.
                why: The validator looks for exactly {gltf_path}.spec.yaml and silently skips anything else.
                severity: blocking
                checklist: The spec file is named {model}.gltf.spec.yaml and sits beside the model.
                enforced_by:
                  - kind: workflow
                    path: .github/workflows/validate-gltf-files.yml
                    blocking: true
              - id: spec_dimensions_from_issue
                statement: Take the dimensions from the asset's issue, not from the model as built.
                why: >-
                  Copying the built model's measurements makes the check tautological.
                  The spec exists to catch the model drifting away from what was asked for.
                severity: warning
                checklist: Spec dimensions match the issue, not the current mesh.
            faq:
              - question: What happens if a model has no spec file?
                answer: >-
                  It passes. The validator reports geometry facts and previews but
                  cannot fail anything. Adding a spec is how a model gains
                  acceptance criteria at all.
              - question: Which axis do I put in the spec file?
                answer: >-
                  glTF-space axes: up_direction "+Y", facing_direction "-Z". The
                  artist works to +Y forward in Blender and the export converts
                  it to -Z; the spec describes the exported file, which is the
                  one being validated. -Z is Godot's forward, which is why it is
                  the target rather than the glTF spec's +Z.
              - question: Is facing_direction actually checked?
                answer: >-
                  No - it is a declaration for reviewers, not something CI can
                  verify. Nothing in a glTF marks which side of a mesh is the
                  face, so no tool can read the facing off the geometry. What
                  gltf_axes.py measures is the rotation on the node chain, which
                  is a different thing that happens to be reported in the same
                  units. Two exports of the same model, one built facing +Z and
                  one facing -Z, both report "+Z" once their transforms are
                  applied. Treat facing_direction as the written record of what
                  the model is supposed to do, and confirm the actual facing by
                  looking at the render in the PR comment.
              - question: Then what do the axis checks actually catch?
                answer: >-
                  up_direction is real: a Z-up export leaves a rotation on the
                  node chain and fails. facing_direction catches the same class
                  of problem - an export that skipped or botched the axis
                  conversion - and nothing else. A model modelled back-to-front
                  passes both. A model whose orientation cannot be determined is
                  reported as UNKNOWN rather than passed.

                  The related check that does bite is unapplied_transforms
                  (tools/gltf-validator/gltf_transforms.py), which fails a model
                  whose node chain still carries a rotation or scale. Until that
                  passes, neither axis number describes the geometry at all.
            inputs:
              - artifact_kind: static_mesh_gltf
            outputs:
              - artifact_kind: model_spec
            agent:
              automatable: full
              preconditions:
                - The asset's issue states dimensions in metres.
              verification:
                - The spec validates against schemas/model-spec.schema.json.
                - The glTF validation workflow reports OK for every key in the spec.

          - id: integration.add_override_materials
            title: Add override materials
            role: integrator
            tool: godot
            summary: Combine the incoming textures into materials on the container scene.
            instructions:
              - Open the model container scene.
              - Add an override material to each mesh surface that needs one.
              - Wire the exported maps into the material's channels.
            rules:
              - id: materials_on_container_only
                statement: Put override materials on the container scene, never on the imported .gltf.
                why: The next re-export discards anything set on the imported resource.
                severity: blocking
                checklist: Override materials live on the container scene.
            inputs:
              - artifact_kind: model_container_scene
              - artifact_kind: texture_map
            outputs:
              - artifact_kind: override_material
            agent:
              automatable: partial
              mcp_tools:
                - mcp__godot-ai__material_manage
                - mcp__godot-ai__node_set_property
              verification:
                - The container scene renders with the intended materials in an editor screenshot.

          - id: integration.create_spatial_shader
            title: Create a spatial shader
            role: integrator
            tool: godot
            summary: >-
              Where a plain material is not enough, write a spatial shader
              controlling how the model and its textures render.
            instructions:
              - Create a .gdshader with shader_type spatial.
              - Assign it via a ShaderMaterial on the container scene.
            inputs:
              - artifact_kind: override_material
            outputs:
              - artifact_kind: spatial_shader
            agent:
              automatable: partial
              mcp_tools:
                - mcp__godot-ai__material_manage
              verification:
                - The shader compiles with no errors in the Godot output log.

      # -----------------------------------------------------------------------
      - id: programming
        title: Programming
        lane: 4
        roles: [programmer]
        summary: Turn an integrated model into a prefab that works when dropped into a level.
        loop:
          is_iterative: true
          iterates_on: One prefab.
          repeat_trigger: A level designer finds the prefab missing behaviour, or the design changes.
          exit_criteria:
            - The prefab works as-is when instanced into a test level.
        steps:
          - id: programming.create_prefab_scene
            title: Create the prefab scene
            role: programmer
            tool: godot
            summary: >-
              A new scene holding the model container plus all the logic,
              scripts and components that make it a game object.
            instructions:
              - Create a new scene at prefabs/{category}/prefab_{object}.tscn.
              - Instance the model container scene into it.
              - Add the scripts, collision, areas and components the object needs.
            rules:
              - id: prefab_works_standalone
                statement: A prefab must work as-is when dropped into a level.
                why: >-
                  That is the contract level design relies on. A prefab needing
                  per-placement wiring pushes programming work into every level.
                severity: blocking
                checklist: The prefab functions correctly when instanced into a test level with no extra setup.
              - id: no_prefab_for_pure_props
                statement: >-
                  Skip the prefab for a purely decorative object - use the model
                  container scene directly.
                why: >-
                  Objects with no logic in them gain nothing from a prefab layer
                  but cost a file and an indirection.
                severity: advisory
                checklist: Decorative props are placed as container scenes, not prefabs.
            faq:
              - question: Why make this "prefab scene"?
                answer: >-
                  This file has all logic, code and additional components that add
                  functionality to the model. It can be dropped into the game and
                  essentially work as-is as an in-game asset.
              - question: Does every model need a prefab?
                answer: >-
                  No. For purely decorative assets no prefab scene is necessary,
                  as they should have no logic in them.
            inputs:
              - artifact_kind: model_container_scene
            outputs:
              - artifact_kind: prefab_scene
            agent:
              automatable: partial
              mcp_tools:
                - mcp__godot-ai__scene_manage
                - mcp__godot-ai__node_create
                - mcp__godot-ai__script_create
                - mcp__godot-ai__script_attach
              verification:
                - The prefab instances into a test level and the project runs without errors.

      # -----------------------------------------------------------------------
      - id: level_design
        title: Level Design
        lane: 5
        roles: [level_designer]
        summary: Assemble prefabs into levels.
        loop:
          is_iterative: true
          iterates_on: One level.
          repeat_trigger: Playtest feedback, or new prefabs becoming available.
          exit_criteria:
            - The level is playable start to finish.
            - It is registered in globals/scene_manager.gd if it ships.
        steps:
          - id: level_design.create_level_scene
            title: Create the level scene
            role: level_designer
            tool: godot
            summary: A new .tscn under levels/, or under test/levels/ for a scratch level.
            instructions:
              - Create a new scene named level_{level}.tscn.
              - Save it under levels/, or test/levels/ with a test_ prefix for a scratch level.
              - Register shipping levels in globals/scene_manager.gd.
            outputs:
              - artifact_kind: level_scene
            agent:
              automatable: partial
              mcp_tools:
                - mcp__godot-ai__scene_manage
                - mcp__godot-ai__scene_save
              verification:
                - The scene opens and the project runs.

          - id: level_design.populate_level
            title: Populate the level with prefabs
            role: level_designer
            tool: godot
            summary: Instance prefabs to give the level its content and functionality.
            instructions:
              - Instance prefabs from prefabs/ into the level.
              - Place decorative props as model container scenes.
              - Playtest.
            rules:
              - id: instance_dont_duplicate
                statement: Instance prefabs; never copy their contents into the level.
                why: >-
                  A copied prefab stops receiving fixes. Instancing means one edit
                  updates every placement.
                severity: blocking
                checklist: Prefabs are instanced, not inlined.
            inputs:
              - artifact_kind: prefab_scene
              - artifact_kind: model_container_scene
            outputs:
              - artifact_kind: level_scene
            agent:
              automatable: partial
              mcp_tools:
                - mcp__godot-ai__node_create
                - mcp__godot-ai__scene_save
                - mcp__godot-ai__project_run
              verification:
                - The level runs and every instanced prefab behaves as expected.

    edges:
      # --- forward -----------------------------------------------------------
      - { from: art.claim_asset, to: art.create_placeholder, kind: forward }
      - { from: art.create_placeholder, to: art.model, kind: forward }
      - { from: art.model, to: art.texture, kind: forward }
      - { from: art.texture, to: art.export_gltf, kind: forward }
      - { from: art.export_gltf, to: update_in_place.place_files, kind: forward }
      - { from: update_in_place.update_asset, to: update_in_place.place_files, kind: forward }
      - { from: update_in_place.place_files, to: update_in_place.import_into_godot, kind: forward }
      - { from: update_in_place.import_into_godot, to: update_in_place.verify_import_sidecar, kind: forward }
      - { from: update_in_place.verify_import_sidecar, to: update_in_place.commit, kind: forward }
      - { from: update_in_place.commit, to: integration.create_container_scene, kind: forward }
      - { from: integration.create_container_scene, to: integration.write_model_spec, kind: forward }
      - { from: integration.create_container_scene, to: integration.add_override_materials, kind: forward }
      - { from: integration.add_override_materials, to: integration.create_spatial_shader, kind: forward }
      - { from: integration.create_container_scene, to: programming.create_prefab_scene, kind: forward }
      - { from: programming.create_prefab_scene, to: level_design.create_level_scene, kind: forward }
      - { from: level_design.create_level_scene, to: level_design.populate_level, kind: forward }

      # --- repeat: the same work, again --------------------------------------
      - from: update_in_place.commit
        to: update_in_place.update_asset
        kind: repeat
        label: Repeat
        condition: The asset needs another revision. This is the loop most assets live in.
      - from: level_design.populate_level
        to: level_design.create_level_scene
        kind: repeat
        condition: Playtesting calls for a new level variation or version.

      # --- rework: back to an earlier owner ----------------------------------
      - from: art.texture
        to: art.model
        kind: rework
        condition: The UVs or normals need fixing before texturing can continue.
      - from: update_in_place.verify_import_sidecar
        to: update_in_place.place_files
        kind: rework
        condition: A .import sidecar was not generated, usually because a file was copied outside Godot.
      - from: integration.create_container_scene
        to: update_in_place.update_asset
        kind: rework
        condition: The imported model needs a change only the artist can make.
      - from: integration.write_model_spec
        to: art.model
        kind: rework
        condition: >-
          The glTF validator reports FAIL against the spec - wrong dimensions,
          over the poly budget, or a missing root node.
      - from: integration.add_override_materials
        to: art.texture
        kind: rework
        condition: The exported maps are wrong or missing, so no material can be built from them.
      - from: programming.create_prefab_scene
        to: integration.create_container_scene
        kind: rework
        condition: The prefab needs material or hierarchy changes that belong in the container scene.
      - from: level_design.populate_level
        to: programming.create_prefab_scene
        kind: rework
        condition: The prefab is missing behaviour the level needs.

    open_questions:
      - id: migrate_existing_texture_names
        question: Do existing textures get renamed to the t_ convention, and when?
        context: >-
          Committed assets still use exporter-given names like
          RainBarrel_Base_Color.png. The convention says fix these at the
          exporter and re-export rather than renaming, which means each affected
          asset needs an artist to touch it. That is either a deliberate sweep or
          something that happens naturally as assets get revised.
        blocks:
          - Enforcing the texture naming pattern in CI rather than at review.

  # ---------------------------------------------------------------------------
  - id: sprite_2d
    title: 2D Sprite Pipeline
    status: stub
    entry_step: authoring.create_aseprite_file
    summary: >-
      STUB. Records only what .github/scripts/validate-aseprite-files.py already
      enforces. The authoring and integration phases are not documented yet.
    conventions:
      naming_patterns:
        - id: aseprite_filename
          pattern: "{lowercase_with_underscores}.{ext}"
          regex: "^[a-z0-9]+(_[a-z0-9]+)*\\.[a-z0-9]+$"
          description: Shared with the audio pipeline. Mirrored by the aseprite_filename_pattern code mirror.
          examples:
            valid:
              - spider.aseprite
              - spider_walk.png
            invalid:
              - Spider.aseprite
              - spider-walk.png
              - spider walk.png
          enforced_by:
            - kind: workflow
              path: .github/workflows/validate-aseprite-files.yml
              blocking: true
            - kind: script
              path: .github/scripts/validate-aseprite-files.py
              symbol: FILENAME_PATTERN
        - id: aseprite_tag_name
          pattern: "{lowercase_with_underscores}"
          regex: "^[a-z0-9]+(_[a-z0-9]+)*$"
          description: Animation tag names inside an .aseprite file. Must also be unique within the file.
          examples:
            valid:
              - walk
              - attack_heavy
            invalid:
              - Walk
              - attack-heavy
          enforced_by:
            - kind: script
              path: .github/scripts/validate-aseprite-files.py
              symbol: TAG_NAME_PATTERN
      directory_layout:
        - path: assets/art/2d/{game_object}/
          description: >-
            One directory per game object. The file stem must match its parent or
            grandparent directory, so assets/art/2d/spider/spider.aseprite and
            assets/art/2d/spider/animations/spider.aseprite are both accepted.
          example: assets/art/2d/spider/spider.aseprite
        - path: assets/art/2d/{game_object}/animations/
          description: Optional nesting level for animation files.
          example: assets/art/2d/spider/animations/spider.aseprite
      rules:
        - id: max_texture_dimension
          statement: Keep textures at or under 1024 px in either dimension.
          why: Web builds have a tight texture memory budget.
          severity: blocking
          checklist: No texture exceeds 1024 px.
          enforced_by:
            - kind: script
              path: .github/scripts/validate-aseprite-files.py
              symbol: MAX_TEXTURE_DIMENSION
              blocking: true
    phases:
      - id: authoring
        title: Authoring
        lane: 1
        roles: [artist]
        summary: STUB - only the file and tag naming rules are recorded.
        loop:
          is_iterative: true
          iterates_on: One game object's sprite sheet.
          repeat_trigger: Animation feedback.
          exit_criteria:
            - The aseprite validation workflow passes.
        steps:
          - id: authoring.create_aseprite_file
            title: Create the .aseprite file
            role: artist
            summary: >-
              STUB. One file per game object, with each animation as a tag. See
              .github/ISSUE_TEMPLATE/create_aseprite_animations.yaml for the
              acceptance criteria currently in use.
            opened_by_issue_template: .github/ISSUE_TEMPLATE/create_aseprite_animations.yaml
    edges: []
    open_questions:
      - id: tags_required
        question: Should every .aseprite file be required to have animation tags?
        context: >-
          ENFORCE_TAGS_REQUIRED is False in validate-aseprite-files.py. The
          written convention says one file per game object with every animation
          as a tag, but the art committed in sibling projects does not follow it,
          so turning the check on would fail existing work.
        blocks:
          - Documenting the 2D pipeline as authoritative.
      - id: one_shot_repeat
        question: Should one-shot animations be required to set repeat = 1?
        context: >-
          ENFORCE_ONE_SHOT_REPEAT is False, with LOOP_TAG_SUFFIX = "_loop"
          distinguishing looping tags. Same conflict as tags_required.
        blocks:
          - Documenting the 2D pipeline as authoritative.

  # ---------------------------------------------------------------------------
  - id: audio
    title: Audio Pipeline
    status: stub
    entry_step: authoring.deliver_audio_file
    summary: >-
      STUB. Records only what .github/scripts/validate-audio-files.py already
      enforces.
    conventions:
      naming_patterns:
        - id: audio_filename
          pattern: "{lowercase_with_underscores}.{ext}"
          regex: "^[a-z0-9]+(_[a-z0-9]+)*\\.[a-z0-9]+$"
          examples:
            valid:
              - door_open.wav
              - ambient_forest_day.ogg
            invalid:
              - DoorOpen.wav
              - door-open.wav
          enforced_by:
            - kind: workflow
              path: .github/workflows/validate-audio-files.yml
              blocking: true
            - kind: script
              path: .github/scripts/validate-audio-files.py
              symbol: FILENAME_PATTERN
      rules:
        - id: no_mp3
          statement: Deliver .wav or .ogg. Never commit .mp3.
          why: MP3's encoder padding makes seamless loops impossible.
          severity: blocking
          checklist: No .mp3 files are included.
          enforced_by:
            - kind: workflow
              path: .github/workflows/flag-mp3-files.yml
              blocking: true
        - id: wav_format
          statement: WAV files must be 44100 Hz, 16-bit, mono.
          why: One consistent format keeps the web build's decode cost predictable.
          severity: blocking
          checklist: WAV files are 44.1 kHz / 16-bit / mono.
          enforced_by:
            - kind: script
              path: .github/scripts/validate-audio-files.py
              symbol: WAV_FILE_SPECIFICATIONS
              blocking: true
        - id: loudness
          statement: Normalise to -16 LUFS with a peak no higher than -1.0 dBFS.
          why: Consistent perceived loudness across every sound, with headroom against clipping.
          severity: warning
          checklist: Audio is normalised to -16 LUFS, peak <= -1.0 dBFS.
          enforced_by:
            - kind: script
              path: .github/scripts/validate-audio-files.py
              symbol: WAV_FILE_SPECIFICATIONS
    phases:
      - id: authoring
        title: Authoring
        lane: 1
        roles: [artist]
        summary: STUB - only the delivery format rules are recorded.
        loop:
          is_iterative: true
          iterates_on: One sound.
          repeat_trigger: Audio direction feedback.
          exit_criteria:
            - The audio validation workflow passes.
        steps:
          - id: authoring.deliver_audio_file
            title: Deliver the audio file
            role: artist
            summary: >-
              STUB. See .github/ISSUE_TEMPLATE/create_sfx.yaml and
              create_ambient_audio.yaml for the criteria currently in use. The
              .claude/generate-placeholder-audio skill produces conforming
              placeholders.
            opened_by_issue_template: .github/ISSUE_TEMPLATE/create_sfx.yaml
    edges: []
