  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n  <header style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:32px;border-bottom:2px solid #f5b41c;padding-bottom:18px\">\n    <div>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;color:#7d9ccc;margin-bottom:10px\">MODULAR PART KIT · v1<\u002Fdiv>\n      <h1 style=\"margin:0;font-size:44px;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:#f5b41c\">Strike Fighter Mk-II<\u002Fh1>\n      <p style=\"margin:12px 0 0;max-width:56ch;font-size:15px;line-height:1.55;color:#a8c1e8;text-wrap:pretty\">Seven hardpoint slots, three variants each. Every variant mounts to the same anchor table, so any combination assembles without rework — 2 187 valid builds.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:auto auto;gap:6px 20px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#7d9ccc;white-space:nowrap\">\n      <span style=\"color:#4d6ea8\">HULL LENGTH<\u002Fspan><span>7.6 m<\u002Fspan>\n      <span style=\"color:#4d6ea8\">WINGSPAN<\u002Fspan><span>6.5 m<\u002Fspan>\n      <span style=\"color:#4d6ea8\">UP AXIS<\u002Fspan><span>+Y · nose −Z<\u002Fspan>\n      <span style=\"color:#4d6ea8\">EXPORT<\u002Fspan><span>OBJ+MTL / GLB<\u002Fspan>\n      <span style=\"color:#4d6ea8\">SHADING<\u002Fspan><span>flat / faceted<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#1d3a70;border:1px solid #1d3a70;margin-top:28px\">\n    <div style=\"background:#0d1c40;padding:16px 18px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#4d6ea8;margin-bottom:8px\">MATERIAL SET<\u002Fdiv>\n      <div style=\"display:flex;gap:6px;margin-bottom:10px\">\n        <span style=\"width:24px;height:24px;background:#f5b41c\"><\u002Fspan>\n        <span style=\"width:24px;height:24px;background:#e08a12\"><\u002Fspan>\n        <span style=\"width:24px;height:24px;background:#ea5c14\"><\u002Fspan>\n        <span style=\"width:24px;height:24px;background:#1d6273\"><\u002Fspan>\n        <span style=\"width:24px;height:24px;background:#1d3557\"><\u002Fspan>\n        <span style=\"width:24px;height:24px;background:#efe6d2\"><\u002Fspan>\n        <span style=\"width:24px;height:24px;background:#cf3323\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:12.5px;color:#a8c1e8;line-height:1.5\">9 shared materials, named for faction re-tint. Swap the two yellows plus the trim orange and the whole kit re-skins.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0d1c40;padding:16px 18px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#4d6ea8;margin-bottom:8px\">ANCHOR TABLE (m)<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.9;color:#c6d9f7;white-space:nowrap\">\n        <div>anchor_nose &nbsp;&nbsp;0.00, 0.02, −2.55<\u002Fdiv>\n        <div>anchor_cockpit 0.00, 0.40, −1.05<\u002Fdiv>\n        <div>anchor_wing_L −0.72, 0.02, 0.10<\u002Fdiv>\n        <div>anchor_wing_R &nbsp;0.72, 0.02, 0.10<\u002Fdiv>\n        <div>anchor_engine 0.00, 0.30, 2.00<\u002Fdiv>\n        <div>anchor_weapon 0.00, −0.34, −1.10<\u002Fdiv>\n        <div>anchor_tail &nbsp;&nbsp;0.00, 0.48, 1.70<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0d1c40;padding:16px 18px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#4d6ea8;margin-bottom:8px\">GODOT NOTES<\u002Fdiv>\n      <ul style=\"margin:0;padding-left:16px;font-size:12.5px;color:#a8c1e8;line-height:1.65\">\n        <li>Import GLB — anchors arrive as empty Node3D children of the root.<\u002Fli>\n        <li>Wings are one node holding a mirrored pair (scale.x = −1 on the left).<\u002Fli>\n        <li>Left wing carries a negative scale — flip normals or use double-sided if your shader culls.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"background:#0d1c40;padding:16px 18px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#4d6ea8;margin-bottom:8px\">STAT COLUMNS<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:#a8c1e8;line-height:1.6\">Numbers below are starting values for balance passes, not final. Mass is in tonnes; the second stat is the slot's signature trait.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <section style=\"margin-top:44px;display:flex;flex-direction:column;gap:40px\">\n\n    <div data-screen-label=\"01 Fuselage\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:14px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#ea5c14;letter-spacing:.16em\">SLOT_01<\u002Fspan>\n        <h2 style=\"margin:0;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:#f5b41c\">Fuselage<\u002Fh2>\n        <span style=\"font-size:13.5px;color:#7d9ccc\">Defines the spine every other slot bolts to. All three share the same anchor table.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px\">\n        <div style=\"background:#0d1c40;border:1px solid #1d3a70\">\n          <img src=\"e76e2ab3-7a3c-400b-98ff-b229478482b0\" alt=\"Keelframe fuselage\" style=\"display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid #1d3a70\">\n          <div style=\"padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h3 style=\"margin:0;font-size:17px;color:#fff\">Keelframe<\u002Fh3><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4d6ea8\">Hull_Standard<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:8px 0 12px;font-size:13px;line-height:1.5;color:#a8c1e8\">Stock spine with shoulder intakes. Balanced mass, nothing wasted.<\u002Fp>\n            <div style=\"display:flex;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">MASS 4.2t<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">HULL 100<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0d1c40;border:1px solid #1d3a70\">\n          <img src=\"b13d44e2-4af3-44be-b198-1f385e032ca6\" alt=\"Broadcore fuselage\" style=\"display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid #1d3a70\">\n          <div style=\"padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h3 style=\"margin:0;font-size:17px;color:#fff\">Broadcore<\u002Fh3><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4d6ea8\">Hull_Broad<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:8px 0 12px;font-size:13px;line-height:1.5;color:#a8c1e8\">Wide deck with side sponsons. More cargo and cooling, less agility.<\u002Fp>\n            <div style=\"display:flex;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">MASS 5.0t<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">HULL 120<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0d1c40;border:1px solid #1d3a70\">\n          <img src=\"06aef20a-09a2-4894-8e3d-e6cf990813aa\" alt=\"Bastion fuselage\" style=\"display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid #1d3a70\">\n          <div style=\"padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h3 style=\"margin:0;font-size:17px;color:#fff\">Bastion<\u002Fh3><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4d6ea8\">Hull_Armored<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:8px 0 12px;font-size:13px;line-height:1.5;color:#a8c1e8\">Layered flank plate and ribs. Heaviest option, soaks punishment.<\u002Fp>\n            <div style=\"display:flex;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">MASS 6.1t<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">HULL 165<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-screen-label=\"02 Cockpit\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:14px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#ea5c14;letter-spacing:.16em\">SLOT_02<\u002Fspan>\n        <h2 style=\"margin:0;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:#f5b41c\">Cockpit<\u002Fh2>\n        <span style=\"font-size:13.5px;color:#7d9ccc\">Trades visibility against protection. Sits proud of the dorsal spine.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px\">\n        <div style=\"background:#0d1c40;border:1px solid #1d3a70\">\n          <img src=\"899f444a-179a-49fb-916d-ed5085004d85\" alt=\"Bubble canopy\" style=\"display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid #1d3a70\">\n          <div style=\"padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h3 style=\"margin:0;font-size:17px;color:#fff\">Bubble<\u002Fh3><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4d6ea8\">Cockpit_Bubble<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:8px 0 12px;font-size:13px;line-height:1.5;color:#a8c1e8\">Frameless teal blister on an orange lip ring. Widest field of view.<\u002Fp>\n            <div style=\"display:flex;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">MASS 0.5t<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">VIEW 340°<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0d1c40;border:1px solid #1d3a70\">\n          <img src=\"54be3a6f-b00f-4fe2-b264-96d545ba9548\" alt=\"Facetdome canopy\" style=\"display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid #1d3a70\">\n          <div style=\"padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h3 style=\"margin:0;font-size:17px;color:#fff\">Facetdome<\u002Fh3><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4d6ea8\">Cockpit_Faceted<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:8px 0 12px;font-size:13px;line-height:1.5;color:#a8c1e8\">Eight-pane cage with yellow ribs. Middle ground, best silhouette.<\u002Fp>\n            <div style=\"display:flex;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">MASS 0.7t<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">VIEW 280°<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0d1c40;border:1px solid #1d3a70\">\n          <img src=\"121ece33-fe11-413c-a924-64341af33c4b\" alt=\"Slitvisor canopy\" style=\"display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid #1d3a70\">\n          <div style=\"padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h3 style=\"margin:0;font-size:17px;color:#fff\">Slitvisor<\u002Fh3><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4d6ea8\">Cockpit_Armored<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:8px 0 12px;font-size:13px;line-height:1.5;color:#a8c1e8\">Buttoned-up wedge with a narrow visor band and side vents.<\u002Fp>\n            <div style=\"display:flex;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">MASS 1.1t<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">VIEW 140°<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-screen-label=\"03 Nose\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:14px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#ea5c14;letter-spacing:.16em\">SLOT_03<\u002Fspan>\n        <h2 style=\"margin:0;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:#f5b41c\">Nose<\u002Fh2>\n        <span style=\"font-size:13.5px;color:#7d9ccc\">Carries the sensor package — and, on one variant, the melee answer.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px\">\n        <div style=\"background:#0d1c40;border:1px solid #1d3a70\">\n          <img src=\"0502027a-e54b-4cdf-99ff-7dfdf3548d4f\" alt=\"Radome nose\" style=\"display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid #1d3a70\">\n          <div style=\"padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h3 style=\"margin:0;font-size:17px;color:#fff\">Radome<\u002Fh3><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4d6ea8\">Nose_Radome<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:8px 0 12px;font-size:13px;line-height:1.5;color:#a8c1e8\">Teal blister over the array, orange collar, pitot probe. The stock look.<\u002Fp>\n            <div style=\"display:flex;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">MASS 0.6t<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">LOCK 1.4 km<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0d1c40;border:1px solid #1d3a70\">\n          <img src=\"1a222926-9c52-4f55-8914-381cf5b82a17\" alt=\"Ramspike nose\" style=\"display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid #1d3a70\">\n          <div style=\"padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h3 style=\"margin:0;font-size:17px;color:#fff\">Ramspike<\u002Fh3><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4d6ea8\">Nose_Ram<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:8px 0 12px;font-size:13px;line-height:1.5;color:#a8c1e8\">Banded cone ending in a bone spike. Collision damage, no sensors.<\u002Fp>\n            <div style=\"display:flex;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">MASS 0.9t<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">LOCK 0.6 km<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0d1c40;border:1px solid #1d3a70\">\n          <img src=\"028f2f75-6491-406f-9c36-bb89b10a32cc\" alt=\"Sensor rig nose\" style=\"display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid #1d3a70\">\n          <div style=\"padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h3 style=\"margin:0;font-size:17px;color:#fff\">Sensor Rig<\u002Fh3><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4d6ea8\">Nose_Sensor<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:8px 0 12px;font-size:13px;line-height:1.5;color:#a8c1e8\">Exposed dish and twin whip antennae on a flat wedge. Fragile, far-seeing.<\u002Fp>\n            <div style=\"display:flex;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">MASS 0.4t<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">LOCK 2.6 km<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-screen-label=\"04 Wings\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:14px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#ea5c14;letter-spacing:.16em\">SLOT_04<\u002Fspan>\n        <h2 style=\"margin:0;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:#f5b41c\">Wings<\u002Fh2>\n        <span style=\"font-size:13.5px;color:#7d9ccc\">One node, mirrored pair, 4.3° dihedral. Drives turn rate and hardpoint count.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px\">\n        <div style=\"background:#0d1c40;border:1px solid #1d3a70\">\n          <img src=\"79f65c1 d #244a86;color:#c6d9f7;padding:4px 8px\">MASS 1.8t<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">TURN 112<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0d1c40;border:1px solid #1d3a70\">\n          <img src=\"cbce4131-a65f-4ab1-8ec4-425b17be381a\" alt=\"Forwardswept wings\" style=\"display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid #1d3a70\">\n          <div style=\"padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h3 style=\"margin:0;font-size:17px;color:#fff\">Forwardswept<\u002Fh3><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4d6ea8\">Wing_Forward<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:8px 0 12px;font-size:13px;line-height:1.5;color:#a8c1e8\">Split X pair — upper vane forward, lower vane aft, dark tip housings.<\u002Fp>\n            <div style=\"display:flex;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">MASS 2.1t<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">TURN 96<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-screen-label=\"05 Engines\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:14px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#ea5c14;letter-spacing:.16em\">SLOT_05<\u002Fspan>\n        <h2 style=\"margin:0;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:#f5b41c\">Engines<\u002Fh2>\n        <span style=\"font-size:13.5px;color:#7d9ccc\">Rear-mounted block. Each nozzle carries an emissive ring for the thrust VFX.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px\">\n        <div style=\"background:#0d1c40;border:1px solid #1d3a70\">\n          <img src=\"89b848b1-a6ed-4a4e-8f13-2dfccf7ce210\" alt=\"Twin pod engines\" style=\"display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid #1d3a70\">\n          <div style=\"padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h3 style=\"margin:0;font-size:17px;color:#fff\">Twin Pod<\u002Fh3><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4d6ea8\">Engine_TwinPod<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:8px 0 12px;font-size:13px;line-height:1.5;color:#a8c1e8\">Two ringed barrels on short pylons, bridged across the spine.<\u002Fp>\n            <div style=\"display:flex;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">MASS 2.2t<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">THRUST 100<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0d1c40;border:1px solid #1d3a70\">\n          <img src=\"a347a88d-e75a-4e69-9f17-967b961568da\" alt=\"Quad cluster engines\" style=\"display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid #1d3a70\">\n          <div style=\"padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h3 style=\"margin:0;font-size:17px;color:#fff\">Quad Cluster<\u002Fh3><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4d6ea8\">Engine_Quad<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:8px 0 12px;font-size:13px;line-height:1.5;color:#a8c1e8\">Four bone-white tubes in a diamond on a yellow block. Best acceleration.<\u002Fp>\n            <div style=\"display:flex;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">MASS 2.6t<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">THRUST 128<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0d1c40;border:1px solid #1d3a70\">\n          <img src=\"5c3e3fd9-f5a0-4072-b327-d019a34dccaa\" alt=\"Monodrive engine\" style=\"display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid #1d3a70\">\n          <div style=\"padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h3 style=\"margin:0;font-size:17px;color:#fff\">Monodrive<\u002Fh3><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4d6ea8\">Engine_Single<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:8px 0 12px;font-size:13px;line-height:1.5;color:#a8c1e8\">One fat barrel with three heat fins and a bell nozzle. Loud and simple.<\u002Fp>\n            <div style=\"display:flex;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">MASS 3.0t<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#122a55;border:1px solid #244a86;color:#c6d9f7;padding:4px 8px\">THRUST 115<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-screen-label=\"06 Weapons\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:14px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#ea5c14;letter-spac
