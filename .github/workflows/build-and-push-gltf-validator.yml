name: Build and Push Validate GLTF Container

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tools/gltf-validator/**'
      - '.github/workflows/build-and-push-gltf-validator.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-push-validate-gltf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GHCR rejects uppercase characters in image names, but the owner slug is
      # mixed case (Screwloose-Games). Lowercase it rather than hardcoding the
      # org, so a fork pushes to its own registry instead of failing on a 403.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gltf-validator" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and cache Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./tools/gltf-validator
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max