name: Validate GLTF Files

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.gltf'
      - '**.glb'
      - '**.spec.yaml'
      # Re-run (and re-test) the validator whenever its own code changes.
      - 'tools/gltf-validator/**'
      - '.github/scripts/validate-model-files.py'
      - '.github/scripts/test_validate_model_files.py'
      - '.github/workflows/validate-gltf-files.yml'

# Add permissions block
permissions:
  pull-requests: write  # Required to create/update comments
  contents: write # write access to the repository contents
  packages: read # read access to the GitHub Packages

jobs:
  validate-gltf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Every check here is node-graph maths and accessor metadata, so it is
      # tested outside the validator image: numpy, pyyaml and jsonschema only, no
      # trimesh or pyrender. Runs before the image is pulled so a broken check
      # fails fast and cheap.
      - name: Test the model checks
        run: |
          pip install numpy pyyaml jsonschema
          python tools/gltf-validator/test_gltf_axes.py
          python tools/gltf-validator/test_gltf_transforms.py
          python tools/gltf-validator/test_gltf_document.py
          python tools/gltf-validator/test_gltf_measure.py
          python tools/gltf-validator/test_gltf_godot_import.py
          python tools/gltf-validator/test_model_spec.py
          python tools/gltf-validator/test_validate_gltf_spec.py
          python .github/scripts/test_validate_model_files.py

      # `safe_output: false` is load-bearing, not decoration. Without it this
      # action backslash-escapes the JSON it writes, which still parses but
      # yields paths that match nothing -- so the job goes green having checked
      # zero files. That is how the audio validator broke twice; the model
      # validator raises a named error rather than repeating it.
      #
      # .spec.yaml is included because editing only a spec already triggers this
      # workflow (see on.paths above) and used to validate nothing.
      - name: Find changed model files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          json: true
          safe_output: false
          write_output_files: true
          separator: "\n"
          files: |
            **.gltf
            **.glb
            **.spec.yaml

      - name: Verify the contents of the .github/outputs/all_changed_files.json file
        run: |
          cat .github/outputs/all_changed_files.json
          echo "All changed files: ${{ steps.changed-files.outputs.all_changed_files }}"

      # THE GATE. Everything below this step is presentation: the container
      # renders previews and writes a PR comment, but it decides nothing.
      #
      # This runs before Docker is even contacted, so a model that fails its spec
      # fails in seconds rather than after an image pull and an X server boot --
      # and the identical command runs from a laptop, a pre-commit hook and a
      # Claude Code hook, so nobody is surprised by CI.
      - name: Validate models against their specs
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        run: |
          mkdir -p gltf-validation-results
          # pipefail is load-bearing: without it this step reports tee's exit
          # status, which is always 0, and the gate would stop gating.
          set -o pipefail
          python .github/scripts/validate-model-files.py \
            --changed-files-json .github/outputs/all_changed_files.json \
            | tee gltf-validation-results/gate.txt

      # GHCR rejects uppercase in image names but the repo slug is mixed case, so
      # lowercase it. Derived rather than hardcoded so every repo and fork pulls
      # the image its own build-and-push-gltf-validator.yml produced.
      #
      # Scoped by GITHUB_REPOSITORY rather than GITHUB_REPOSITORY_OWNER: owner
      # alone collides across repos in one org, and the loser of that collision
      # cannot push its image at all (403). See the longer note on the matching
      # step in build-and-push-gltf-validator.yml -- these two expressions must
      # stay identical, or this job pulls an image that job never pushed.
      - name: Resolve validator image
        id: image
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/gltf-validator:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create output directory
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        run: mkdir -p gltf-validation-results

      - name: Install Xvfb and dependencies
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Runs even when the gate above failed -- deliberately. An artist whose
      # model is the wrong size needs to see the render *and* the reason; a
      # failing check that also hides the picture makes the failure harder to fix.
      - name: GLTF validator
        id: gltf-validator
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
        run: |
          HOST_OUTPUT_DIR="$(dirname "$GITHUB_OUTPUT")"

          if [ -s .github/outputs/all_changed_files.json ]; then
            echo "Processing files from JSON..."

            # Only models go to the renderer. The changed-files step above also
            # picks up .spec.yaml, because a spec-only edit still needs checking
            # -- but there is nothing to render for one, and validate_gltf.py
            # would report it as an unreadable model.
            mapfile -t files < <(jq -r '.[] | select(test("\\.(gltf|glb)$"; "i"))' \
              .github/outputs/all_changed_files.json)

            for f in "${files[@]}"; do
              echo "  $f"
            done

            if [ ${#files[@]} -eq 0 ]; then
              echo "Only spec files changed; nothing to render."
              exit 0
            fi

            docker run --rm \
              -v "$(pwd):/workspace" \
              -v "${HOST_OUTPUT_DIR}:${HOST_OUTPUT_DIR}" \
              -w /workspace \
              -e GITHUB_OUTPUT="${GITHUB_OUTPUT}" \
              -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
              -e GITHUB_COMMIT_SHA="${GITHUB_COMMIT_SHA}" \
              ${{ steps.image.outputs.name }} \
              "/workspace/gltf-validation-results" "${files[@]}"
          else
            echo "No GLTF files to process"
          fi

      - name: Upload validation results
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: gltf-validation-results
          path: gltf-validation-results/
          retention-days: 1

      # The render images are pushed to an orphan `assets` branch so they can be
      # linked from the PR comment without bloating the main branch's history.
      # A fresh repo has no such branch, so create it before the checkout below
      # tries to fetch it -- otherwise the whole workflow hard-fails on the very
      # first model anyone commits.
      #
      # This uses plumbing rather than `checkout --orphan` on purpose: commit-tree
      # writes a parentless commit straight to the object store, so the working
      # tree and the currently checked-out branch are never disturbed.
      - name: Ensure assets branch exists
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          if git ls-remote --exit-code --heads origin assets >/dev/null 2>&1; then
            echo "assets branch already exists"
          else
            echo "assets branch missing - creating it"
            empty_tree="$(git hash-object -t tree /dev/null)"
            commit="$(git commit-tree "$empty_tree" -m 'Initialize assets branch')"
            git push origin "$commit:refs/heads/assets"
          fi

      - name: Checkout assets branch
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: assets
          path: assets-branch

      # The renderer's comment only covers the checks the container can see, and
      # its per-model marker means "these verdicts passed" -- it cannot speak for
      # filename_convention, godot_node_suffixes, collision_within_visual,
      # rests_on_ground or orphan_spec, which run only in the gate. Put the gate's
      # own output at the top so the comment leads with the thing that decides the
      # check.
      #
      # This also makes the comment survive a broken renderer. github_comment.md is
      # written by the container, so when the container died the next step hit
      # FileNotFoundError and the PR got no comment at all -- losing the verdicts
      # too, which had been computed successfully a dozen steps earlier.
      - name: Assemble the PR comment
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        run: |
          mkdir -p gltf-validation-results
          comment=gltf-validation-results/github_comment.md
          assembled=gltf-validation-results/assembled.md
          : > "$assembled"

          if [ -s gltf-validation-results/gate.txt ]; then
            {
              printf '### Verdicts\n\n'
              printf 'Authoritative — this is the step that passes or fails the check.\n\n'
              printf '```\n'
              cat gltf-validation-results/gate.txt
              printf '```\n\n'
            } >> "$assembled"
          fi

          if [ -s "$comment" ]; then
            cat "$comment" >> "$assembled"
          else
            printf '_The renderer produced no output, so this run has no 3D preview links and no rendered views. See the workflow log._\n' >> "$assembled"
          fi

          mv "$assembled" "$comment"
          echo "--- assembled comment ---"
          cat "$comment"

      # `pip install requests` is load-bearing. process_markdown.py imports it, and
      # this is the only workflow that calls that script -- the other validators
      # comment via thollander/actions-comment-pull-request, so nothing else would
      # notice it missing.
      #
      # It is needed here and not in tiny-pet (where the same script has always
      # worked) because this job runs actions/setup-python, which puts a bare
      # tool-cache interpreter ahead of the runner's system python3 on PATH. The
      # system one ships requests; a tool-cache one ships pip, setuptools and wheel
      # and nothing else. Without this line the step dies on ModuleNotFoundError and
      # takes the whole PR comment with it -- the verdicts, the 3D preview links and
      # all nine rendered views -- while every step before it stays green.
      - name: Run markdown processor
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ISSUE_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pip install requests
          python .github/scripts/process_markdown.py "gltf-validation-results/github_comment.md"

      - name: Commit and push new images to `assets` branch
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        run: |
          cd assets-branch
          git status
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded-assets
          git commit -m "Add uploaded assets" || echo "No changes to commit"
          git push origin HEAD:assets

      # There used to be a "Set workflow status" step here that gated the job on
      # validate_gltf.py's `success` output. That output means "the file loaded
      # and rendered", not "the model met its spec" -- process_gltf_file returns
      # success unconditionally once it has produced images -- so a model that
      # FAILed every check in its spec still turned the job green.
      #
      # The gate is now the "Validate models against their specs" step near the
      # top of this job, which exits non-zero on a real verdict and does it
      # before any image is pulled. Nothing below it needs to fail the build.
