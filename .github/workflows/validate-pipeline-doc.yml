name: Validate Pipeline Document

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'documentation/pipeline/**'
      - 'schemas/asset-pipeline.schema.json'
      - 'schemas/model-spec.schema.json'
      - 'tools/pipeline/**'
      # Re-run whenever a constant the document mirrors could have moved.
      - '.github/scripts/validate-aseprite-files.py'
      - '.github/scripts/validate-audio-files.py'
      - '.github/ISSUE_TEMPLATE/**'
      # Re-run (and re-test) the check itself whenever its own code changes.
      - '.github/scripts/validate-pipeline-doc.py'
      - '.github/scripts/test_validate_pipeline_doc.py'
      - '.github/workflows/validate-pipeline-doc.yml'

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-pipeline-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      # Self-test first, like the sibling asset validators, so a broken checker
      # cannot pass a broken document.
      - name: Test validator
        run: python .github/scripts/test_validate_pipeline_doc.py

      # Same reasoning one directory over: these are the tests for the CLI that
      # renders and checks everything below.
      - name: Test pipeline CLI
        run: |
          python tools/pipeline/test_common.py
          python tools/pipeline/test_pipeline_cli.py
          python tools/pipeline/test_asset_report.py
          python tools/pipeline/test_asset_list.py
          python tools/pipeline/test_issue_forms.py
          python tools/pipeline/test_issue_commands.py
          python tools/pipeline/test_backlog.py

      # Confirms the screenshots in documentation/pipeline/images/ are still
      # byte-identical to the payloads embedded in the Miro SVG they came from.
      - name: Check extracted images match the source diagram
        run: python tools/pipeline/pipeline.py extract images --check

      # Schema, plus every cross-reference the schema cannot express: edge
      # endpoints, reachability, image hashes, enforcement paths, regex examples,
      # and drift between the document and the constants it mirrors.
      - name: Validate pipeline document
        id: validate-pipeline-doc
        run: python .github/scripts/validate-pipeline-doc.py

      # PIPELINE.md is generated. If it does not match what pipeline.yaml renders
      # to, the human-readable view and the machine-readable source disagree.
      - name: Check PIPELINE.md is up to date
        run: python tools/pipeline/pipeline.py render pipeline --check

      # Only checks templates that have opted in by carrying the markers;
      # templates without them are reported and left alone.
      - name: Check generated issue-template blocks are up to date
        run: python tools/pipeline/pipeline.py render issue-templates --check

      # documentation/pipeline/backlog/*.yaml is deliberately not gated here.
      # Those files are hand-authored input, so there is nothing to diff them
      # against, and the obvious gate -- `backlog file` without --apply -- still
      # resolves organization field ids over the network to show the commands it
      # would run. That needs a scope this workflow's repo-scoped token does not
      # have, the same reason `asset list --check` is a local command.

      - name: Comment PR
        if: ${{ !cancelled() && steps.validate-pipeline-doc.outputs.metadata != '' }}
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: pipeline-doc-check
          github-token: ${{ secrets.GITHUB_TOKEN }}
          message: |
            # Asset pipeline document 🗺️
            ${{ steps.validate-pipeline-doc.outputs.metadata }}
            <br />
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ISSUE_NUMBER: ${{ github.event.pull_request.number }}
